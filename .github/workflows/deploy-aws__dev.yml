name: Deploy AWS — dev
on:
  push:
    branches: [dev]
    paths: ['sgit_ai_api/**', 'sgit_vaults/**', 'deploy/**', 'tests/**', 'pyproject.toml', '.github/workflows/deploy-aws*.yml']
  workflow_dispatch:
    inputs:
      open_instance:
        description: 'Deploy with NO access token (every route open). Only on purpose.'
        type: boolean
        default: false
jobs:
  dev:
    permissions:
      id-token: write      # a called workflow cannot hold more than its caller grants; OIDC needs this here
      contents: read
    uses: ./.github/workflows/deploy-aws-lambda.yml
    with:
      stage: dev
      open_instance: ${{ inputs.open_instance == true }}
    secrets: inherit      # AWS_DEPLOY_ROLE_ARN + SGIT_VAULTS__ACCESS_TOKEN come from the 'dev' GitHub Environment
