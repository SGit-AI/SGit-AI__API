name: Deploy Vault to GitHub Pages

# Publishes the reference vault's encrypted object store (vault/.sg_vault/bare/) to
# GitHub Pages at the exact paths the live API serves:
#     https://<org>.github.io/<repo>/api/vault/read/<vault-id>/bare/...
# so a static host and the live read endpoint are interchangeable for reads.
# See vault/README.md and tests/unit/vault_conformance/.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions" (configure-pages below
# attempts to enable it automatically; if that step 403s, one click in Settings fixes it).

on:
  push:
    branches:
      - dev
    paths:
      - 'vault/**'
      - '.github/workflows/deploy-vault-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VAULT_ID: 'ivpijuvg'                 # the reference vault — see vault/README.md
  READ_KEY: 'c28b118c9a7a101910efa24a3a49b6cc6dbec8e8dcdc8fea671e89cecb0ab817'   # published deliberately: read-only capability

jobs:
  deploy:
    name: "Publish vault projection"
    runs-on: ubuntu-latest
    timeout-minutes: 10                  # Pages deployments hard-timeout at 10 minutes anyway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site (path-mirrored projection)
        run: |
          mkdir -p "_site/api/vault/read/${VAULT_ID}"
          cp -r vault/.sg_vault/bare "_site/api/vault/read/${VAULT_ID}/bare"
          cp pages/* _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
