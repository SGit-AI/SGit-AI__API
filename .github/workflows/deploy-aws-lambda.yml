# Deploy the sgit vaults API to AWS Lambda — one stack per stage — then prove it.
#
#   build image → push to ECR → CloudFormation deploy → smoke → parity gate vs the API as it
#   runs today → CloudFront enabled check → deployment record.
#
# Auth: GitHub OIDC only (secret AWS_DEPLOY_ROLE_ARN = the role from deploy/aws/github-oidc-role.cfn.yml).
# Without the secret every job after the tests skips gracefully and says so.
# Stages mirror the origin repo's three User Lambdas: dev (push to dev), main (push to main),
# prod (manual, via the "prod" GitHub Environment so it can require approval).

name: Deploy AWS Lambda (base)

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string          # dev | main | prod
      storage_mode:
        required: false
        type: string
        default: s3
      domain_name:            # optional custom domain trio (CloudFront + Route53)
        required: false
        type: string
        default: ''
      hosted_zone_id:
        required: false
        type: string
        default: ''
      certificate_arn:
        required: false
        type: string
        default: ''
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: false
      ACCESS_TOKEN:
        required: false

env:
  AWS_REGION   : eu-west-2
  ECR_REPO     : sgit-vaults-api
  STACK_NAME   : sgit-vaults-api--${{ inputs.stage }}

permissions:
  id-token: write
  contents: read

jobs:

  tests:
    name: Unit tests (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/pytest__run-tests@dev
        with: { test_target: "tests/unit" }

  check-role:
    name: OIDC role configured?
    runs-on: ubuntu-latest
    outputs:
      has-role: ${{ steps.check.outputs.has-role }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then echo "has-role=true" >> "$GITHUB_OUTPUT";
          else echo "has-role=false" >> "$GITHUB_OUTPUT"; echo "::notice::AWS_DEPLOY_ROLE_ARN not set — deploy skipped (tests + image build still run)"; fi

  build-image:
    name: Build the API-only image
    runs-on: ubuntu-latest
    needs: [tests]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(tr -d '[:space:]' < sgit_ai_api/version)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Build (linux/amd64 — the Lambda architecture)
        run: docker build -f deploy/docker/Dockerfile -t $ECR_REPO:${{ steps.meta.outputs.tag }} .
      - name: Self-contained invariant — boots with no network, answers health and OpenAPI
        run: |
          docker run -d --name inv --network=none -e SEND__STORAGE_MODE=memory $ECR_REPO:${{ steps.meta.outputs.tag }}
          sleep 8
          docker exec inv python -c "import urllib.request; assert b'ok' in urllib.request.urlopen('http://127.0.0.1:8080/api/info/health').read()"
          docker exec inv python -c "import urllib.request,json; p=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/openapi.json'))['paths']; assert any(x.startswith('/api/vault/') for x in p), p"
          docker rm -f inv
      - run: docker save $ECR_REPO:${{ steps.meta.outputs.tag }} | gzip > /tmp/image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: image-${{ inputs.stage }}, path: /tmp/image.tar.gz, retention-days: 1 }

  deploy:
    name: "Deploy stage: ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    needs: [build-image, check-role]
    if: needs.check-role.outputs.has-role == 'true'
    environment: ${{ inputs.stage == 'prod' && 'prod' || '' }}
    outputs:
      function_url: ${{ steps.outputs.outputs.function_url }}
      public_url  : ${{ steps.outputs.outputs.public_url }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with: { name: image-${{ inputs.stage }}, path: /tmp }
      - name: Push image to ECR
        id: ecr
        run: |
          docker load < /tmp/image.tar.gz
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REPO_URI=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
          aws ecr describe-repositories --repository-names $ECR_REPO >/dev/null 2>&1 || aws ecr create-repository --repository-name $ECR_REPO --image-scanning-configuration scanOnPush=true >/dev/null
          aws ecr get-login-password | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com
          docker tag $ECR_REPO:${{ needs.build-image.outputs.tag }} $REPO_URI:${{ needs.build-image.outputs.tag }}
          docker push $REPO_URI:${{ needs.build-image.outputs.tag }}
          echo "image_uri=$REPO_URI:${{ needs.build-image.outputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: CloudFormation deploy
        run: |
          if [ -z "${{ secrets.ACCESS_TOKEN }}" ]; then echo "::warning::ACCESS_TOKEN secret not set for stage ${{ inputs.stage }} — deploying an OPEN instance"; fi
          aws cloudformation deploy --template-file deploy/aws/lambda.cfn.yml \
            --stack-name $STACK_NAME --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset \
            --parameter-overrides ImageUri=${{ steps.ecr.outputs.image_uri }} Stage=${{ inputs.stage }} \
                                  StorageMode=${{ inputs.storage_mode }} AccessToken="${{ secrets.ACCESS_TOKEN }}" \
                                  DomainName="${{ inputs.domain_name }}" HostedZoneId="${{ inputs.hosted_zone_id }}" CertificateArn="${{ inputs.certificate_arn }}"
      - name: Read stack outputs
        id: outputs
        run: |
          q() { aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "function_url=$(q FunctionUrl)"       >> "$GITHUB_OUTPUT"
          echo "public_url=$(q PublicUrl)"           >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(q DistributionId)" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ inputs.stage }}: $(q PublicUrl)"

  verify:
    name: "Smoke + parity gate against the live ${{ inputs.stage }} stack"
    runs-on: ubuntu-latest
    needs: [deploy]
    env:
      SEND__STORAGE_MODE: memory                     # the legacy in-process side of the parity gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tests/regression/requirements.txt
      - name: Smoke suite (the deployed-target suite; API-only, no UI root)
        env:
          SG_BASE_URL    : ${{ needs.deploy.outputs.function_url }}
          SG_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SG_EXPECT_UI   : 'false'
        run: python -m pytest tests/deploy -q -rs --tb=short
      - name: Parity gate — the API as it runs today (in-process) vs the deployed stack (origin, not edge)
        env:
          SG_LEGACY_URL: inprocess
          SG_NEW_URL   : ${{ needs.deploy.outputs.function_url }}
          SG_NEW_TOKEN : ${{ secrets.ACCESS_TOKEN }}
        run: python -m pytest tests/regression -q -rs --tb=short
      - name: Parity gate — via the edge too, when a custom domain is configured
        if: needs.deploy.outputs.distribution_id != ''
        env:
          SG_LEGACY_URL: inprocess
          SG_NEW_URL   : ${{ needs.deploy.outputs.public_url }}
          SG_NEW_TOKEN : ${{ secrets.ACCESS_TOKEN }}
        run: python -m pytest tests/regression -q -rs --tb=short -k parity

  cloudfront:
    name: CloudFront distribution enabled?
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check, and enable if disabled
        run: bash deploy/aws/cloudfront_ensure_enabled.sh "${{ needs.deploy.outputs.distribution_id }}" "$STACK_NAME"

  record:
    name: Deployment record
    runs-on: ubuntu-latest
    needs: [deploy, verify, cloudfront]
    if: always() && needs.deploy.result == 'success'
    steps:
      - run: |
          {
            echo "## sgit vaults API — stage \`${{ inputs.stage }}\`"
            echo "- Public URL: ${{ needs.deploy.outputs.public_url }}"
            echo "- Function URL: ${{ needs.deploy.outputs.function_url }}"
            echo "- Verify: ${{ needs.verify.result }} · CloudFront: ${{ needs.cloudfront.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
